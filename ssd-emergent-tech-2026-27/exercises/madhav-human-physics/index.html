<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Human Physics Playground</title>

<script src="../../vendor/matter-0.20.0.min.js"></script>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    overflow: hidden;
    background: #151515;
    font-family: Arial, sans-serif;
}

canvas {
    display: block;
}

/* =========================
TOOLBAR
========================= */

#toolbar {

    position: fixed;

    top: 20px;
    left: 20px;

    display: flex;

    flex-wrap: wrap;

    gap: 8px;

    width: 650px;

    z-index: 100;

}

button {

    border: none;

    background: #eeeeee;

    color: #111;

    padding: 10px 14px;

    cursor: pointer;

    border-radius: 5px;

    font-size: 13px;

    transition: 0.15s;

}

button:hover {

    transform: scale(1.05);

    background: white;

}

button.active {

    background: #ffcc00;

}

#info {

    position: fixed;

    bottom: 20px;
    left: 20px;

    color: white;

    font-size: 13px;

    line-height: 1.6;

    opacity: 0.7;

    z-index: 100;

    pointer-events: none;

}

#title {

    position: fixed;

    top: 20px;
    right: 20px;

    color: white;

    font-size: 18px;

    font-weight: bold;

    z-index: 100;

}

.exhibition-back{position:fixed;left:14px;bottom:14px;z-index:10000;padding:9px 12px;border:1px solid #ffffff55;border-radius:999px;background:#111d;color:#fff;font:700 11px/1 system-ui,sans-serif;letter-spacing:.07em;text-decoration:none;text-transform:uppercase;backdrop-filter:blur(10px)}
</style>

</head>


<body>

<button class="tool" data-tool="blast">

<button class="tool" data-tool="explosion">

</button>

</button>

</div>


<div id="title">

HUMAN PHYSICS PLAYGROUND

</div>


<div id="info">

Experiment with the human.<br>

Drag → move body parts<br>
Ball → drop heavy balls<br>
Blast → push the human<br>
Explosion → launch everything nearby<br>

<script>


// ======================================================
// MATTER
// ======================================================

const {

    Engine,
    Render,
    Runner,

    Bodies,
    Body,

    Composite,
    Constraint,

    Mouse,
    MouseConstraint,

    Events,

    Query

} = Matter;



// ======================================================
// ENGINE
// ======================================================

const engine = Engine.create();

const world = engine.world;

engine.gravity.y = 1;


// MUCH HIGHER ACCURACY

engine.positionIterations = 20;

engine.velocityIterations = 16;

engine.constraintIterations = 12;



// ======================================================
// RENDER
// ======================================================

const render = Render.create({

    element: document.body,

    engine: engine,

    options: {

        width: window.innerWidth,

        height: window.innerHeight,

        wireframes: false,

        background: "#151515"

    }

});


Render.run(render);


const runner = Runner.create({

    isFixed: true,

    delta: 1000 / 60

});


Runner.run(runner, engine);



// ======================================================
// PREVIEW + EXPLOSION VISUALS
// ======================================================

Events.on(
    render,
    "afterRender",
    () => {

        const ctx = render.context;

        ctx.save();


        // ---- SHAPE PREVIEW (rectangle / circle / wall) ----

        if (
            startPoint
            &&
            currentTool === "rectangle"
        ) {

            const x =
                Math.min(startPoint.x, currentMousePosition.x);

            const y =
                Math.min(startPoint.y, currentMousePosition.y);

            const w =
                Math.abs(currentMousePosition.x - startPoint.x);

            const h =
                Math.abs(currentMousePosition.y - startPoint.y);

            ctx.strokeStyle = "#ffcc00";
            ctx.lineWidth = 2;
            ctx.setLineDash([6, 4]);
            ctx.strokeRect(x, y, w, h);

            ctx.fillStyle = "rgba(255, 204, 0, 0.1)";
            ctx.fillRect(x, y, w, h);

        }


        if (
            startPoint
            &&
            currentTool === "circle"
        ) {

            const radius =
                Math.hypot(
                    currentMousePosition.x - startPoint.x,
                    currentMousePosition.y - startPoint.y
                );

            ctx.strokeStyle = "#ffcc00";
            ctx.lineWidth = 2;
            ctx.setLineDash([6, 4]);
            ctx.beginPath();
            ctx.arc(startPoint.x, startPoint.y, radius, 0, Math.PI * 2);
            ctx.stroke();

            ctx.fillStyle = "rgba(255, 204, 0, 0.1)";
            ctx.fill();

        }


        if (
            isDrawing
            &&
            currentTool === "draw"
            &&
            drawingPoints.length > 0
        ) {

            ctx.strokeStyle = "#ffcc00";
            ctx.lineWidth = 20;
            ctx.lineCap = "round";
            ctx.lineJoin = "round";
            ctx.setLineDash([]);
            ctx.globalAlpha = 0.5;

            ctx.beginPath();
            ctx.moveTo(drawingPoints[0].x, drawingPoints[0].y);

            for (let i = 1; i < drawingPoints.length; i++) {
                ctx.lineTo(drawingPoints[i].x, drawingPoints[i].y);
            }

            ctx.lineTo(currentMousePosition.x, currentMousePosition.y);
            ctx.stroke();

            ctx.globalAlpha = 1;

        }


        // ---- EXPLOSION VISUAL EFFECT ----

        ctx.setLineDash([]);

        const now = Date.now();

        explosionEffects = explosionEffects.filter(fx => {

            const age = now - fx.start;

            const life = fx.duration;

            if (age > life) return false;

            const progress = age / life;

            const radius = fx.maxRadius * progress;

            const alpha = 1 - progress;


            // shockwave ring

            ctx.beginPath();
            ctx.arc(fx.x, fx.y, radius, 0, Math.PI * 2);
            ctx.strokeStyle = `rgba(255, 140, 0, ${alpha})`;
            ctx.lineWidth = 6 * (1 - progress) + 1;
            ctx.stroke();


            // inner flash

            const flashRadius =
                Math.max(0, fx.maxRadius * 0.3 * (1 - progress));

            const gradient =
                ctx.createRadialGradient(
                    fx.x, fx.y, 0,
                    fx.x, fx.y, flashRadius
                );

            gradient.addColorStop(0, `rgba(255, 255, 200, ${alpha})`);
            gradient.addColorStop(1, `rgba(255, 100, 0, 0)`);

            ctx.beginPath();
            ctx.fillStyle = gradient;
            ctx.arc(fx.x, fx.y, flashRadius, 0, Math.PI * 2);
            ctx.fill();


            return true;

        });


        ctx.restore();

    }
);

let customBodies = [];

let jointLimits = [];

let startPoint = null;

let drawingPoints = [];

let isDrawing = false;

let lastImpactSound = 0;

let currentMousePosition = { x: 0, y: 0 };

let explosionEffects = [];

        }).catch(err => console.warn("audio unlock failed:", err));

    });

}

// ======================================================
// SOUND SYSTEM
// ======================================================

let audioContext = null;


function getAudioContext() {

    if (!audioContext) {

        audioContext =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();

    }

    return audioContext;

}



// ======================================================
// PLAY TONE
// ======================================================

function playTone(
    frequency,
    duration,
    type = "sine",
    volume = 0.1
) {

    const ctx = getAudioContext();

    const oscillator =
        ctx.createOscillator();

    const gain =
        ctx.createGain();


    oscillator.type = type;

    oscillator.frequency.value =
        frequency;


    gain.gain.setValueAtTime(
        volume,
        ctx.currentTime
    );


    gain.gain.exponentialRampToValueAtTime(
        0.001,
        ctx.currentTime + duration
    );


    oscillator.connect(gain);

    gain.connect(ctx.destination);


    oscillator.start();

    oscillator.stop(
        ctx.currentTime + duration
    );

}

function soundImpact(strength = 1) {

    const frequency =
        Math.max(
            60,
            180 - strength * 5
        );

    playTone(
        frequency,
        0.08,
        "square",
        0.06
    );

}


function soundBlast() {

    playTone(

        "sawtooth",
        0.12
    );

}

        0.5,
        "sawtooth",
        0.2
    );

}

// ======================================================
// PREVENT PHYSICS TUNNELING
// ======================================================

Events.on(
    engine,
    "beforeUpdate",
    () => {

        ragdollBodies.forEach(body => {

            const velocity =
                body.velocity;


            const speed =
                Math.sqrt(
                    velocity.x * velocity.x +
                    velocity.y * velocity.y
                );


            // IMPORTANT:
            // LIMIT SPEED SO LIMBS
            // DON'T PASS THROUGH OBJECTS

            const maxSpeed = 18;


            if (speed > maxSpeed) {

                const scale =
                    maxSpeed / speed;


                Body.setVelocity(
                    body,
                    {
                        x:
                            velocity.x * scale,

                        y:
                            velocity.y * scale
                    }
                );

            }


            // LIMIT SPIN

            const maxAngularVelocity =
                0.35;


            if (

                Math.abs(
                    body.angularVelocity
                )

                >

                maxAngularVelocity

            ) {

                Body.setAngularVelocity(

                    body,

                    Math.sign(
                        body.angularVelocity
                    )

                    *

                    maxAngularVelocity

                );

            }

        });

    }

);



// ======================================================
// ANGLE SYSTEM
// ======================================================

function angleDifference(a, b) {

    let difference =
        a - b;


    while (
        difference > Math.PI
    ) {

        difference -=
            Math.PI * 2;

    }


    while (
        difference < -Math.PI
    ) {

        difference +=
            Math.PI * 2;

    }


    return difference;

}



function limitJoint(

    bodyA,
    bodyB,

    minAngle,
    maxAngle

) {

    jointLimits.push({

        bodyA,

        bodyB,

        min:
            minAngle *
            Math.PI / 180,

        max:
            maxAngle *
            Math.PI / 180

    });

}



// ======================================================
// APPLY ANGLE LIMITS
// ======================================================

Events.on(
    engine,
    "beforeUpdate",
    () => {

        jointLimits.forEach(joint => {

            const relativeAngle =

                angleDifference(

                    joint.bodyB.angle,

                    joint.bodyA.angle

                );


            if (

                relativeAngle >

                joint.max

            ) {

                Body.setAngle(

                    joint.bodyB,

                    joint.bodyA.angle +

                    joint.max

                );


                Body.setAngularVelocity(

                    joint.bodyB,

                    0

                );

            }


            if (

                relativeAngle <

                joint.min

            ) {

                Body.setAngle(

                    joint.bodyB,

                    joint.bodyA.angle +

                    joint.min

                );


                Body.setAngularVelocity(

                    joint.bodyB,

                    0

                );

            }

        });

    }

);

        rightUpperArm,

        rightLowerArm,

        { x: 0, y: 30 },

    );


    const leftHip = createJoint(

        torso,

        leftUpperLeg,

        { x: -17, y: 40 },

        { x: 0, y: -34 }

    );


    const leftKnee = createJoint(

        leftUpperLeg,

        leftLowerLeg,

        { x: 0, y: 34 },

    );


    const rightHip = createJoint(

        torso,

        rightUpperLeg,

        ]

    );


    ragdollBodies.push(

        ...bodies

    );



    // ==================================================
    // JOINT LIMITS
    // ==================================================

    limitJoint(
        torso,
        head,
        -30,
        30
    );


    limitJoint(
        torso,
        leftUpperArm,
        -140,
        60
    );


    limitJoint(
        torso,
        rightUpperArm,
        -60,
        140
    );


    limitJoint(
        leftUpperArm,
        leftLowerArm,
        0,
        150
    );


    limitJoint(
        rightUpperArm,
        rightLowerArm,
        -150,
        0
    );


    limitJoint(
        torso,
        leftUpperLeg,
        -60,
        70
    );


    limitJoint(
        torso,
        rightUpperLeg,
        -70,
        60
    );


    limitJoint(
        leftUpperLeg,
        leftLowerLeg,
        0,
        140
    );


    limitJoint(
        rightUpperLeg,
        rightLowerLeg,
        -140,
        0
    );

}



// ======================================================
// CREATE RECTANGLE
// ======================================================

function createRectangle(start, end) {

    const width =
        Math.abs(end.x - start.x);


    const height =
        Math.abs(end.y - start.y);


    if (

        width < 15 ||

        height < 15

    ) return;


    const body = Bodies.rectangle(

        (start.x + end.x) / 2,

        (start.y + end.y) / 2,

        width,

        height,

        {

            isStatic: true,

            friction: 1,

            restitution: 0,

            render: {

                fillStyle: "#666666"

            }

        }

    );


    Composite.add(
        world,
        body
    );


    customBodies.push(
        body
    );


    playMetalSound();

}



// ======================================================
// CREATE CIRCLE
// ======================================================

function createCircle(start, end) {

    const radius =

        Math.hypot(

            end.x - start.x,

            end.y - start.y

        );


    if (radius < 10) return;


    const body = Bodies.circle(

        start.x,

        start.y,

        radius,

        {

            isStatic: true,

            friction: 1,

            render: {

                fillStyle: "#777777"

            }

        }

    );


    Composite.add(
        world,
        body
    );


    customBodies.push(
        body
    );


    playMetalSound();

}



// ======================================================
// DRAW WALL
// ======================================================

function createDrawnWall(points) {

    if (
        points.length < 2
    ) return;


    for (

        let i = 0;

        i < points.length - 1;

        i++

    ) {

        const a =
            points[i];

        const b =
            points[i + 1];


        const dx =
            b.x - a.x;

        const dy =
            b.y - a.y;


        const length =
            Math.hypot(dx, dy);


        if (
            length < 5
        ) continue;


        const wall =
            Bodies.rectangle(

                (a.x + b.x) / 2,

                (a.y + b.y) / 2,

                length + 4,

                20,

                {

                    isStatic: true,

                    angle:

                        Math.atan2(
                            dy,
                            dx
                        ),

                    friction: 1,

                    render: {

                        fillStyle: "#888888"

                    }

                }

            );


        Composite.add(
            world,
            wall
        );


        customBodies.push(
            wall
        );

    }


    soundCreate();

}



// ======================================================
// DROP BALL
// ======================================================

function dropBall(position) {

    const ball = Bodies.circle(

        position.x,

        position.y,

        35,

        {

            density: 0.02,

            friction: 0.6,

            restitution: 0.5,

            frictionAir: 0.01,

            render: {

                fillStyle: "#e74c3c"

            }

        }

    );


    Composite.add(
        world,
        ball
    );


    customBodies.push(
        ball
    );


    playMetalSound();

}



// ======================================================
// BLAST
// ======================================================

function blast(position) {

    ragdollBodies.forEach(body => {

        const dx =
            body.position.x -
            position.x;

        const dy =
            body.position.y -
            position.y;


        const distance =
            Math.max(

                50,

                Math.hypot(
                    dx,
                    dy
                )

            );


        const force =
            0.08 /
            distance;


        Body.applyForce(

            body,

            body.position,

            {

                x:
                    dx * force,

                y:
                    dy * force

            }

        );

    });


    soundBlast();

}



// ======================================================
// EXPLOSION
// ======================================================

function explosion(position) {

    const allBodies =
        [
            ...ragdollBodies,
            ...customBodies
        ];


    allBodies.forEach(body => {

        if (
            body.isStatic
        ) return;


        const dx =
            body.position.x -
            position.x;

        const dy =
            body.position.y -
            position.y;


        const distance =
            Math.max(

                40,

                Math.hypot(
                    dx,
                    dy
                )

            );


        const force =
            0.15 /
            distance;


        Body.applyForce(

            body,

            body.position,

            {

                x:
                    dx * force,

                y:
                    dy * force

            }

        );

    });


    explosionEffects.push({
        x: position.x,
        y: position.y,
        start: Date.now(),
        duration: 500,
        maxRadius: 160
    });


    playFahhSound();

}



// ======================================================
// DELETE
// ======================================================

function deleteBody(position) {

    const found =
        Query.point(

            customBodies,

            position

        );


    found.forEach(body => {

        Composite.remove(
            world,
            body
        );


        const index =
            customBodies.indexOf(
                body
            );


        if (
            index !== -1
        ) {

            customBodies.splice(
                index,
                1
            );

        }

    });


    if (
        found.length > 0
    ) {

        soundClick();

    }

}



// ======================================================
// COLLISION SOUNDS
// ======================================================

Events.on(

    engine,

    "collisionStart",

    event => {

        const now =
            Date.now();


        if (
            now -
            lastImpactSound
            <
            80
        ) return;


        event.pairs.forEach(pair => {

            const a =
                pair.bodyA;

            const b =
                pair.bodyB;


            const ragdollHit =

                ragdollBodies.includes(a)

                ||

                ragdollBodies.includes(b);


            if (
                ragdollHit
            ) {

                const speed =

                    Math.hypot(

                        a.velocity.x -
                        b.velocity.x,

                        a.velocity.y -
                        b.velocity.y

                    );


                if (
                    speed > 4
                ) {

                    soundImpact(
                        speed
                    );


                    lastImpactSound =
                        now;

                }

            }

        });

    }

);



// ======================================================
// MOUSE
// ======================================================

const mouse =
    Mouse.create(
        render.canvas
    );


const mouseConstraint =
    MouseConstraint.create(

        engine,

        {

            mouse: mouse,

            constraint: {

                stiffness: 0.15,

                damping: 0.2,

                render: {

                    visible: false

                }

            }

        }

    );


Composite.add(
    world,
    mouseConstraint
);


render.mouse =
    mouse;



// ======================================================
// GRAB SOUND (human only)
// ======================================================

Events.on(

    mouseConstraint,

    "startdrag",

    event => {

        if (
            ragdollBodies.includes(event.body)
        ) {

            playPunchSound();

        }

    }

);



// ======================================================
// MOUSE POSITION
// ======================================================

function getMousePosition(event) {

    const rect =
        render.canvas.getBoundingClientRect();


    return {

        x:
            event.clientX -
            rect.left,

        y:
            event.clientY -
            rect.top

    };

}



// ======================================================
// MOUSE DOWN
// ======================================================

render.canvas.addEventListener(

    "mousedown",

    event => {

        const position =
            getMousePosition(
                event
            );


        if (
            currentTool === "drag"
        ) {

            return;

        }


        if (
            currentTool === "delete"
        ) {

            deleteBody(
                position
            );

            return;

        }


        if (
            currentTool === "ball"
        ) {

            dropBall(
                position
            );

            return;

        }


        if (
            currentTool === "blast"
        ) {

            blast(
                position
            );

            return;

        }


        if (
            currentTool === "explosion"
        ) {

            explosion(
                position
            );

            return;

        }


        if (

            currentTool === "rectangle"

            ||

            currentTool === "circle"

        ) {

            startPoint =
                position;

        }


        if (
            currentTool === "draw"
        ) {

            drawingPoints =
                [position];


            isDrawing = true;

        }

    }

);



// ======================================================
// MOUSE MOVE
// ======================================================

render.canvas.addEventListener(

    "mousemove",

    event => {

        const position =
            getMousePosition(
                event
            );


        currentMousePosition =
            position;


        if (

            currentTool !== "draw"

            ||

            !isDrawing

        ) return;


        const lastPoint =

            drawingPoints[
                drawingPoints.length - 1
            ];


        if (

            Math.hypot(

                position.x -
                lastPoint.x,

                position.y -
                lastPoint.y

            )

            >

            10

        ) {

            drawingPoints.push(
                position
            );

        }

    }

);



// ======================================================
// MOUSE UP
// ======================================================

render.canvas.addEventListener(

    "mouseup",

    event => {

        const position =
            getMousePosition(
                event
            );


        if (

            currentTool === "rectangle"

            &&

            startPoint

        ) {

            createRectangle(

                startPoint,

                position

            );


            startPoint = null;

        }


        if (

            currentTool === "circle"

            &&

            startPoint

        ) {

            createCircle(

                startPoint,

                position

            );


            startPoint = null;

        }


        if (

            currentTool === "draw"

            &&

            isDrawing

        ) {

            drawingPoints.push(
                position
            );


            createDrawnWall(
                drawingPoints
            );


            drawingPoints = [];


            isDrawing = false;

        }

    }

);



// ======================================================
// RESET HUMAN
// ======================================================

document
.getElementById("reset")
.addEventListener(

    "click",

    () => {


        const constraints =
            Composite.allConstraints(
                world
            );


        constraints.forEach(c => {

            if (

                ragdollBodies.includes(
                    c.bodyA
                )

                ||

                ragdollBodies.includes(
                    c.bodyB
                )

            ) {

                Composite.remove(
                    world,
                    c
                );

            }

        });


        ragdollBodies.forEach(body => {

            Composite.remove(
                world,
                body
            );

        });


        ragdollBodies = [];


        jointLimits = [];


        if (isHumanOutsideFrame) {

            isHumanOutsideFrame = false;

            stopGalaxyMusic();

        }


        createRagdoll(

            window.innerWidth / 2,

            150

        );


        soundClick();

    }

);



// ======================================================
// CLEAR CUSTOM OBJECTS
// ======================================================

document
.getElementById("clear")
.addEventListener(

    "click",

    () => {

        customBodies.forEach(body => {

            Composite.remove(
                world,
                body
            );

        });


        customBodies = [];


        soundClick();

    }

);



// ======================================================
// OUT-OF-FRAME MUSIC
// ======================================================

Events.on(
    engine,
    "afterUpdate",
    () => {

        if (ragdollBodies.length === 0) return;

        let minX = Infinity;
        let maxX = -Infinity;
        let minY = Infinity;
        let maxY = -Infinity;

        ragdollBodies.forEach(body => {

            const bounds = body.bounds;

            if (bounds.min.x < minX) minX = bounds.min.x;
            if (bounds.max.x > maxX) maxX = bounds.max.x;
            if (bounds.min.y < minY) minY = bounds.min.y;
            if (bounds.max.y > maxY) maxY = bounds.max.y;

        });

        const outside =

            maxX < 0 ||
            minX > window.innerWidth ||
            maxY < 0 ||
            minY > window.innerHeight;


        if (outside && !isHumanOutsideFrame) {

            isHumanOutsideFrame = true;

            startGalaxyMusic();

        }


        if (!outside && isHumanOutsideFrame) {

            isHumanOutsideFrame = false;

            stopGalaxyMusic();

        }

    }
);



// ======================================================
// START
// ======================================================

createWalls();


createRagdoll(

    window.innerWidth / 2,

    180

);



// ======================================================
// RESIZE
// ======================================================

window.addEventListener(

    "resize",

    () => {

        location.reload();

    }

);


</script>
