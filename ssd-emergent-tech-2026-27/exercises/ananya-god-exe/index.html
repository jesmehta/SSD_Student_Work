<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GOD.EXE</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02040d;color:#fff;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 48%,transparent 35%,rgba(0,0,0,.5) 100%)}
.hud{position:fixed;inset:0;pointer-events:none}.brand{position:absolute;top:24px;left:28px;letter-spacing:.28em;font-size:11px;opacity:.65}.hint{position:absolute;bottom:25px;left:50%;transform:translateX(-50%);font-size:11px;letter-spacing:.16em;text-transform:uppercase;opacity:.45;white-space:nowrap}
.powers{position:absolute;right:22px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:7px;pointer-events:auto;opacity:.5;transition:.35s}.powers:hover{opacity:1}
.power{border:1px solid rgba(255,255,255,.12);background:rgba(8,12,25,.35);backdrop-filter:blur(12px);color:#fff;border-radius:12px;padding:8px 10px;min-width:118px;text-align:left;cursor:pointer;transition:.2s;font-size:11px}.power:hover,.power.active{background:rgba(100,150,255,.15);border-color:rgba(150,190,255,.45);transform:translateX(-4px)}
.power span{font-size:15px;margin-right:8px}.subtitle{position:absolute;bottom:72px;left:50%;transform:translateX(-50%);max-width:70vw;text-align:center;font-size:15px;letter-spacing:.05em;text-shadow:0 2px 15px #000;opacity:0;transition:opacity .5s}.subtitle.show{opacity:.9}
.start{position:fixed;inset:0;display:grid;place-items:center;background:#000;z-index:5;transition:opacity 1.5s}.start.hide{opacity:0;pointer-events:none}.start button{border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.04);color:#fff;padding:14px 24px;border-radius:999px;letter-spacing:.18em;font-size:11px;cursor:pointer}.start button:hover{background:rgba(255,255,255,.1)}
.final{position:fixed;inset:0;display:none;place-items:center;background:radial-gradient(circle,#10152b 0%,#02030a 70%);z-index:4;text-align:center}.final.show{display:grid}.final h1{font-size:clamp(34px,7vw,90px);letter-spacing:.18em;margin:0 0 24px;font-weight:300}.stats{opacity:.7;font-size:12px;line-height:2;letter-spacing:.12em;text-transform:uppercase}.choices{margin-top:34px;display:flex;gap:14px;justify-content:center}.choices button{background:transparent;color:#fff;border:0;border-bottom:1px solid rgba(255,255,255,.25);padding:10px 18px;letter-spacing:.2em;cursor:pointer}.choices button:hover{border-color:#fff}
@media(max-width:700px){.powers{right:8px}.power{min-width:auto;padding:7px}.power b{display:none}.hint{font-size:9px}.subtitle{max-width:90vw}}
.exhibition-back{position:fixed;left:16px;bottom:16px;z-index:8;padding:9px 12px;border:1px solid rgba(255,255,255,.2);border-radius:999px;background:rgba(0,0,0,.62);color:#fff;font-size:10px;letter-spacing:.1em;text-decoration:none;text-transform:uppercase;backdrop-filter:blur(10px)}.exhibition-back:hover{border-color:#9fc4ff}
</style>
</head>
<body>
<a class="exhibition-back" href="../../index.html">← Exhibition</a>
<canvas id="c"></canvas>
<div class="vignette"></div>
<div class="start" id="start"><button id="enter">ENTER GOD.EXE</button></div>
<div class="hud">
  <div class="brand">GOD.EXE</div>
  <div class="powers" id="powers">
    <button class="power" data-p="sun"><span>☀</span><b>SUN</b></button>
    <button class="power" data-p="rain"><span>☂</span><b>RAIN</b></button>
    <button class="power" data-p="water"><span>◉</span><b>WATER</b></button>
    <button class="power" data-p="forest"><span>♣</span><b>FOREST</b></button>
    <button class="power" data-p="fire"><span>🔥</span><b>FIRE</b></button>
    <button class="power" data-p="lightning"><span>ϟ</span><b>LIGHTNING</b></button>
    <button class="power" data-p="volcano"><span>▲</span><b>VOLCANO</b></button>
    <button class="power" data-p="meteor"><span>☄</span><b>METEOR</b></button>
    <button class="power" data-p="bless"><span>✦</span><b>BLESS</b></button>
    <button class="power" data-p="storm"><span>≋</span><b>STORM</b></button>
  </div>
  <div class="subtitle" id="subtitle"></div>
  <div class="hint">drag to explore · scroll to zoom · choose a power</div>
</div>
<div class="final" id="final">
  <div><h1 id="class"></h1><div class="stats" id="stats"></div><div class="choices">
    <button id="continue">CONTINUE</button><button id="reset">RESET</button><button id="leave">LEAVE</button>
  </div></div>
</div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d'); let W,H,dpr;
function resize(){dpr=devicePixelRatio||1;W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();

const S=JSON.parse(localStorage.getItem('godexe')||'null')||{actions:{},help:0,harm:0,observe:0,chaos:0,awareness:0,trust:50,pop:100,water:50,food:50,nature:70,day:0};
let selected=null, angle=0, zoom=1, dragging=false,lastX=0,lastY=0,rot=0,stars=[];
for(let i=0;i<220;i++)stars.push({x:Math.random(),y:Math.random(),r:Math.random()*1.5,a:.2+Math.random()*.8});
const people=[{n:'MIRA',x:.18,y:.59},{n:'LEO',x:.45,y:.53},{n:'NIKO',x:.60,y:.62},{n:'ARUN',x:.78,y:.42}];
const trees=[];for(let i=0;i<55;i++)trees.push({a:Math.random()*Math.PI*2,r:.38+Math.random()*.2,s:.5+Math.random()*.8});
let particles=[];

function save(){localStorage.setItem('godexe',JSON.stringify(S))}
function say(t){const sub=document.getElementById('subtitle');sub.textContent=t;sub.classList.add('show');if('speechSynthesis'in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.rate=.82;u.pitch=.72;u.volume=.7;speechSynthesis.speak(u)}clearTimeout(say.t);say.t=setTimeout(()=>sub.classList.remove('show'),4300)}
function world(){let cx=W/2+rot*.25,cy=H*.5,R=Math.min(W,H)*.29*zoom;let g=x.createRadialGradient(cx-R*.3,cy-R*.4,R*.05,cx,cy,R*1.1);g.addColorStop(0,'#8ee58c');g.addColorStop(.55,'#31935d');g.addColorStop(.8,'#17604d');g.addColorStop(1,'#071e29');x.beginPath();x.arc(cx,cy,R,0,7);x.fillStyle=g;x.fill();
  // mountains
  for(let i=0;i<7;i++){let a=-2.7+i*.82, px=cx+Math.cos(a)*R*.58,py=cy+Math.sin(a)*R*.58; x.beginPath();x.moveTo(px-R*.2,py+R*.18);x.lineTo(px,py-R*(.25+Math.random()*.12));x.lineTo(px+R*.22,py+R*.18);x.fillStyle='#3b6558';x.fill()}
  // lake
  x.beginPath();x.ellipse(cx+R*.08,cy+R*.25,R*.28,R*.13,0,0,7);x.fillStyle='#3fb9d3';x.fill();
  // village
  for(let i=0;i<8;i++){let px=cx-R*.42+i*R*.11,py=cy+R*.05+(i%2)*R*.08;x.fillStyle='#dca66b';x.fillRect(px,py,12,9);x.fillStyle='#873f4b';x.beginPath();x.moveTo(px-2,py);x.lineTo(px+6,py-7);x.lineTo(px+14,py);x.fill()}
  // trees
  trees.forEach(t=>{let a=t.a+angle*.2,px=cx+Math.cos(a)*R*t.r,py=cy+Math.sin(a)*R*t.r*.65; x.fillStyle='#563f2c';x.fillRect(px-2,py,4,10);x.fillStyle='#237a43';x.beginPath();x.arc(px,py,R*.055*t.s,0,7);x.fill()});
  // volcano
  x.beginPath();x.moveTo(cx+R*.55,cy+R*.22);x.lineTo(cx+R*.72,cy-R*.02);x.lineTo(cx+R*.86,cy+R*.22);x.closePath();x.fillStyle='#332e32';x.fill();x.fillStyle='#ff713e';x.beginPath();x.arc(cx+R*.72,cy+R*.02,5,0,7);x.fill();
  // people
  people.forEach((p,i)=>{let px=cx+(p.x-.5)*R*1.25,py=cy+(p.y-.5)*R*.9; x.fillStyle=['#ffd7b5','#f0b27d','#bfe8ff','#f5cf8d'][i];x.beginPath();x.arc(px,py,5,0,7);x.fill();x.fillStyle='#fff';x.font='7px system-ui';x.fillText(p.n,px-10,py-9)});
  // atmosphere
  x.strokeStyle='rgba(140,220,255,.35)';x.lineWidth=10;x.beginPath();x.arc(cx,cy,R+3,0,7);x.stroke();
}
function draw(){x.clearRect(0,0,W,H);let bg=x.createRadialGradient(W*.5,H*.5,0,W*.5,H*.5,Math.max(W,H));bg.addColorStop(0,'#101a3b');bg.addColorStop(1,'#02040d');x.fillStyle=bg;x.fillRect(0,0,W,H);stars.forEach(s=>{x.globalAlpha=s.a*(.5+.5*Math.sin(performance.now()/1000+s.x*9));x.fillStyle='#fff';x.beginPath();x.arc(s.x*W,s.y*H,s.r,0,7);x.fill()});x.globalAlpha=1;
  // nebula
  x.fillStyle='rgba(70,90,180,.08)';x.beginPath();x.ellipse(W*.2,H*.3,W*.35,H*.18,-.3,0,7);x.fill();
  world();
  particles.forEach(p=>{p.y-=p.v;p.life-=.012;x.globalAlpha=Math.max(0,p.life);x.fillStyle=p.col;x.beginPath();x.arc(p.x,p.y,p.s,0,7);x.fill()});x.globalAlpha=1;particles=particles.filter(p=>p.life>0);requestAnimationFrame(draw)}
draw();

function burst(col,count=80){for(let i=0;i<count;i++)particles.push({x:W/2+(Math.random()-.5)*W*.5,y:H*.5+(Math.random()-.5)*H*.35,v:.3+Math.random()*2,s:1+Math.random()*3,life:1,col})}
function act(p){S.actions[p]=(S.actions[p]||0)+1;S.awareness+=2;S.day+=.03;
 if(p==='rain'){S.water=Math.min(100,S.water+15);S.food=Math.min(100,S.food+8);S.help++;burst('#8fdcff',90);say('The rain is good for them.')}
 if(p==='water'){S.water=Math.min(100,S.water+22);S.help++;burst('#54dfff',60);say('They have water now.')}
 if(p==='forest'){S.nature=Math.min(100,S.nature+14);S.help++;burst('#75e58b',75);say('Something green is growing.')}
 if(p==='sun'){S.food=Math.min(100,S.food+4);burst('#ffe78a',70);say('A little more light.')}
 if(p==='bless'){S.trust=Math.min(100,S.trust+10);S.help++;burst('#ffd66e',120);say('That was kind.')}
 if(p==='fire'){S.nature=Math.max(0,S.nature-12);S.harm++;S.chaos++;burst('#ff7b45',100);say(S.actions.fire>2?'You really like fire.':'They are afraid.')}
 if(p==='lightning'){S.chaos++;S.trust-=1;burst('#cfeaff',110);say(S.actions.lightning>2?'They are learning from it.':'Wait... they are using it.')}
 if(p==='storm'){S.water=Math.min(100,S.water+8);S.nature=Math.max(0,S.nature-3);S.chaos++;burst('#9ba7ff',130);say('The sky is listening.')}
 if(p==='volcano'){S.nature=Math.max(0,S.nature-18);S.harm+=2;S.chaos+=2;burst('#ff603e',150);say('You could have chosen something gentler.')}
 if(p==='meteor'){S.pop=Math.max(8,S.pop-12);S.harm+=8;S.chaos+=5;S.awareness+=5;burst('#ffb35c',180);say(S.actions.meteor>2?'I am beginning to think this is personal.':'Maybe don’t use meteor this time.')}
 save();check();
}
document.querySelectorAll('.power').forEach(b=>b.onclick=()=>act(b.dataset.p));
document.getElementById('enter').onclick=()=>{document.getElementById('start').classList.add('hide');if(S.awareness===0){setTimeout(()=>say('Can you hear me?'),700);setTimeout(()=>say('Good.'),2500);setTimeout(()=>say('This is your world.'),4200);setTimeout(()=>say("They don't know you're here. Yet."),6200)}else say('You’re back. I remember you.');};
addEventListener('mousedown',e=>{dragging=true;lastX=e.clientX});addEventListener('mouseup',()=>dragging=false);addEventListener('mousemove',e=>{if(dragging){angle+=(e.clientX-lastX)*.008;rot+=(e.clientX-lastX);lastX=e.clientX;S.observe++;S.awareness+=.003}});addEventListener('wheel',e=>{zoom=Math.max(.75,Math.min(1.35,zoom-e.deltaY*.0005));S.observe++;});
addEventListener('dblclick',()=>{S.awareness+=4;say('You keep looking.');save()});
let idle=0;setInterval(()=>{idle++;S.day+=.01;if(idle===2)say('Are you still there?');if(idle===5&&S.observe>20)say('You spend a lot of time watching them.');if(idle>8)idle=0;save()},1000);addEventListener('mousemove',()=>idle=0);

function classification(){let a=S.actions, total=Object.values(a).reduce((q,v)=>q+v,0);if(S.harm>12&&S.help>5)return 'THE CHAOS GOD';if(S.harm>10)return 'THE DESTROYER';if(S.observe>250&&total<8)return 'THE OBSERVER';if(S.help>8&&S.nature>60)return 'THE PROTECTOR';if((a.forest||0)+(a.water||0)>8)return 'THE CREATOR';if(total>15&&S.harm<6)return 'THE EXPERIMENTER';return 'THE NEGLECTFUL GOD'}
function check(){if(S.awareness>100){document.getElementById('class').textContent=classification();document.getElementById('stats').innerHTML=`POPULATION REMAINING · ${Math.round(S.pop)}%<br>HELPFUL ACTIONS · ${S.help}<br>DESTRUCTIVE ACTIONS · ${S.harm}<br>MOST USED POWER · ${Object.entries(S.actions).sort((a,b)=>b[1]-a[1])[0]?.[0]?.toUpperCase()||'NONE'}<br>AI TRUST · ${Math.max(0,Math.round(S.trust))}%`;document.getElementById('final').classList.add('show');}}
document.getElementById('continue').onclick=()=>document.getElementById('final').classList.remove('show');
document.getElementById('reset').onclick=()=>{localStorage.removeItem('godexe');location.reload()};
document.getElementById('leave').onclick=()=>{document.getElementById('final').innerHTML='<div><h1>GOODBYE</h1><div class="stats">Someone has to look after them.<br><br>I’ll do it.</div></div>';setTimeout(()=>{document.body.style.transition='opacity 3s';document.body.style.opacity=0},2500);say('Goodbye.')}
</script>

</body>
</html>
